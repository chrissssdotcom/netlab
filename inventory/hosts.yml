# AS4242423420 — dn42 PoPs, named chr-<loc>-pe00.dc.chrissss.dn42 (pe = provider edge).
# ansible_host = how Ansible reaches the box over SSH. The four Linode PoPs get theirs from
# the Linode API at run time (provision.yml / deploy.yml), so the values below are only
# placeholders for them. The home PoP is a fixed address you must set.
all:
  children:
    dn42_routers:
      hosts:
        chr-adl-pe00:   # Home — Adelaide, AU (Rocky 9 VM or mini PC on the home LAN)
          ansible_host: 192.168.88.10     # TODO: an address Ansible/Semaphore can really reach
        chr-fra-pe00:   # Linode — Frankfurt 2, DE (de-fra-2)
          ansible_host: 203.0.113.2       # placeholder: replaced by provision.yml
        chr-lax-pe00:   # Linode — Los Angeles, US (us-lax)
          ansible_host: 203.0.113.3       # placeholder: replaced by provision.yml
        chr-tyo-pe00:   # Linode — Tokyo 3, JP (jp-tyo-3)
          ansible_host: 203.0.113.4       # placeholder: replaced by provision.yml
        chr-syd-pe00:   # Linode — Sydney, AU (ap-southeast)
          ansible_host: 203.0.113.5       # placeholder: replaced by provision.yml
