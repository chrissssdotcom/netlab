# Network-wide settings for AS4242423420. Per-router values live in host_vars/.
ansible_user: root            # Vultr and Linode Rocky images log in as root

# --- Registry resources -------------------------------------------------------
dn42_asn: 4242423420
dn42_domain: dc.chrissss.dn42                    # routers are <inventory name>.<domain>
fqdn: "{{ inventory_hostname }}.{{ dn42_domain }}"   # chr-<loc>-pe00.dc.chrissss.dn42
dn42_prefix6: "fdcd:f79a:c76b"                  # the /48, without the trailing ::
dn42_aggregates6: ["fdcd:f79a:c76b::/48"]       # announced to eBGP from every PoP
dn42_aggregates4: ["172.22.169.32/27", "172.22.101.192/29"]
dn42_loopback_net6: "fdcd:f79a:c76b::/64"       # router /128 loopbacks live here

# --- IPv4 plan: one /29 per PoP, taken from dn42_aggregates4 (set pop_block4 in host_vars).
# Inside each /29:  +0 network   +1 router (gateway for the hosts behind it)   +2 loopback
#                   +3 road-warrior /32   +4..+6 hosts behind the router   +7 broadcast
pop_block4: ""             # e.g. 172.22.169.40/29 — required, one per PoP, never shared
pop_block4_base: "{{ pop_block4.split('/')[0].split('.')[0:3] | join('.') }}"
pop_block4_off: "{{ pop_block4.split('/')[0].split('.')[3] | int }}"

# --- Derived per router from router_id (1-15). Override in host_vars only if needed.
loopback4: "{{ pop_block4_base }}.{{ (pop_block4_off | int) + 2 }}"
loopback6: "{{ dn42_prefix6 }}::{{ '%x' | format(router_id | int) }}"
pop_prefix6: "{{ dn42_prefix6 }}:{{ '%x' | format(router_id | int) }}000::/52"
pop_prefixes4: []          # extra IPv4 service routes this PoP originates internally (e.g. 172.22.169.48/32)
loopback_extra4: []        # extra addresses bound on the dn42 dummy, e.g. "172.22.101.193/32" (anycast DNS)
loopback_extra6: []

# The other routers in the mesh (do not edit)
mesh_peers: "{{ groups['dn42_routers'] | difference([inventory_hostname]) | sort }}"

# --- WireGuard ------------------------------------------------------------------
wg_endpoint: "{{ public_ipv4 | default('') }}"   # what other PoPs dial; '' = they wait for us
wg_mtu: 1420
wg_keepalive: 25
mesh_port_base: 42000       # host i listens for peer j on 42000+j
mesh_default_cost: 100      # OSPF cost per mesh link; set mesh_costs to ~RTT in ms once measured
mesh_costs: {}
ebgp_local_ll: "fe80::3420" # our link-local on external peering tunnels
pubkey_dir: "{{ inventory_dir }}/../pubkeys"   # node public keys are cached here

# --- Road warrior (WireGuard for roaming clients, dual-stack) ------------------
# One tunnel interface per PoP. Clients get a /128 from a /64 carved out of the
# PoP's /52 (already routed by iBGP) and, where the PoP has an IPv4 pool, a /32 too.
# They can reach dn42 only — never the public Internet through us.
rw_enabled: true
rw_interface: rw0           # must NOT match wg-r* or dn42* (firewall and BIRD globs)
rw_listen_port: 51820       # UDP, open to the world; keep clear of 42001-42015 and 20000-29999
rw_endpoint: "{{ wg_endpoint if wg_endpoint else public_ipv4 }}"   # what clients dial
rw_prefix6: "{{ dn42_prefix6 }}:{{ '%x' | format(router_id | int) }}f00"   # PoP /52 -> its f00 /64
rw_net6: "{{ rw_prefix6 }}::/64"
rw_gw6: "{{ rw_prefix6 }}::1"
rw_addr4: "{{ pop_block4_base }}.{{ (pop_block4_off | int) + 3 }}"   # the one road-warrior IPv4 /32 at this PoP
# What a client routes into the tunnel (split tunnel: dn42 and friends only).
# Deliberately not all of 10.0.0.0/8, which most home and office LANs use.
rw_client_allowed_ips:
  - 172.20.0.0/14
  - 172.31.0.0/16
  - 10.100.0.0/14
  - 10.127.0.0/16
  - fd00::/8
rw_dns: []                  # e.g. ["fd42:d42:d42:54::1"] — dn42 resolvers handed to clients
# One entry per device. IPv6: every device gets <rw /64>::<id hex> at every PoP. IPv4: each PoP has
# a single road-warrior /32 (rw_addr4), so at most ONE device per PoP may set `ipv4: true`.
# rw_clients:
#   - name: laptop            # a-z0-9-, max 20 chars
#     id: 2                   # 2..254, unique; the IPv6 host number
#     wg_pubkey: "base64-public-key-generated-on-the-device="
#     ipv4: true              # optional: this device gets the PoP's IPv4 /32 (default: IPv6 only)
#     pops: [chr-adl-pe00, chr-fra-pe00]          # optional: only these PoPs accept it (default: all)
rw_clients: []
rw_ipv4_clients: "{{ rw_clients_here | selectattr('ipv4', 'defined') | selectattr('ipv4') | list }}"
rw_clients_here: >-
  {{ (rw_clients | rejectattr('pops', 'defined') | list)
     + (rw_clients | selectattr('pops', 'defined') | selectattr('pops', 'contains', inventory_hostname) | list) }}

# --- Provisioning at Vultr / Linode (provision.yml, deploy.yml) -----------------
# Credentials are read from the environment, never from this repo:
#   VULTR_API_KEY, LINODE_TOKEN, DN42_ADMIN_SSH_PUBKEY (the public key that gets root)
provision_enabled: "{{ provider in ['Vultr', 'Linode'] }}"   # the home PoP is not provisioned
provision_create: true      # false = only look servers up, fail if one is missing
provision_label: "{{ inventory_hostname }}"   # servers are found by this exact label (chr-<loc>-pe00)
provision_tags: [dn42, ansible]
provision_plan: "{{ {'Vultr': 'vc2-1c-1gb', 'Linode': 'g6-nanode-1'}[provider] }}"   # the $5 / 1 GB plans
provision_image: "{{ {'Vultr': 1869, 'Linode': 'linode/rocky9'}[provider] }}"        # Rocky Linux 9
provision_ssh_public_key: "{{ lookup('ansible.builtin.env', 'DN42_ADMIN_SSH_PUBKEY') }}"
provision_ssh_key_name: dn42-ansible     # Vultr only: name of the key registered in the account
provision_wait_ssh: true
provision_timeout: 900      # seconds to wait for a new server to come up
provision_poll_delay: 10    # seconds between status checks
linode_api_url: https://api.linode.com/v4
vultr_api_url: https://api.vultr.com/v2

# --- VPC behind each router (opt-in; see docs/HOSTING.md, "Pattern B") ------------
# A provider VPC is private IPv4 only. dn42 addresses ride on top of it, which only
# works if the provider's VPC passes traffic from addresses it did not assign.
vpc_enabled: false          # set true per PoP in host_vars, then recreate the server (VPCs attach at creation)
vpc_type: vpc              # vpc = provider VPC (private IPv4, DHCP); vlan = Linode VLAN (plain Layer 2, you assign
                           # the addresses, IPv6 works, nothing is filtered). vlan is Linode-only.
vpc_label: "{{ inventory_hostname }}"   # also the VLAN label
vpc_subnet4: "{{ vpc_dn42_net4 if vpc_dn42_net4 else '10.' ~ (200 + (router_id | int)) ~ '.0.0/24' }}"
# ^ the subnet created at the provider: your dn42 /29 when vpc_dn42_net4 is set (both Vultr and
#   Linode accept custom prefixes), otherwise a private 10.20x.0.0/24 as a placeholder
vpc_static: "{{ vpc_type == 'vlan' or (vpc_dn42_net4 | length > 0) }}"   # we assign the addresses (no DHCP)
vpc_interface: ""           # the VPC NIC; empty = the one interface that is not public/tunnel
vlan_id: ""                 # 802.1Q tag for a tagged VLAN on a physical NIC (the home PoP); empty on Linode
vlan_parent: "{{ public_interface }}"   # the NIC that carries the tagged VLAN
vpc_iface: "{{ (vlan_parent ~ '.' ~ vlan_id) if vlan_id | string | length > 0 else vpc_interface }}"   # resolved at run time by the vpc role
vpc_dn42_net6: "{{ dn42_prefix6 }}:{{ '%x' | format(router_id | int) }}001::/64"   # inside the PoP /52; router = ::1
vpc_dn42_net4: "{{ pop_block4 }}"   # the dn42 IPv4 subnet behind the router; default is the PoP's /29 ('' = IPv6 only)
vpc_gw4: "{{ vpc_dn42_net4.split('/')[0].split('.')[0:3] | join('.') }}.{{ (vpc_dn42_net4.split('/')[0].split('.')[3] | int) + 1 }}"

# --- BGP policy -----------------------------------------------------------------
bgp_import_limit: 10000     # per channel, per eBGP session — far above the dn42 table size
bgp_max_path_len: 25
ebgp_export_prepend: 0
ebgp_peers: []

# --- Edge BGP: a PoP behind a router of its own (the home PoP behind the UniFi) -------------
# A *separate* eBGP session from dn42, over private ASNs. The PoP announces the public addresses
# it owns to the edge router and, if the edge sends defaults, uses it as its Internet gateway.
# Nothing learned here ever reaches the dn42 mesh, and dn42 is never forwarded to the Internet.
edge_bgp_enabled: false
edge_local_asn: 64513       # this router
edge_peer_asn: 64512        # the edge router
edge_local4: ""             # this router's address on the LAN it shares with the edge (v4)
edge_neighbor4: ""          # the edge router's address on that LAN
edge_local6: ""             # same, IPv6 (global/ULA, not link-local)
edge_neighbor6: ""
edge_public_ipv4: ""        # a public /32 the edge routes to this router; bound on dummy pub0
edge_public_net6: ""        # the public IPv6 slice (a /60); the first /64 goes on the VLAN, router = ::1
edge_site_net6: ""          # the /48 the slice must come from
edge_vlan_net6: "{{ edge_public_net6 | regex_replace('::/60$', '::/64') }}"
edge_vlan_gw6: "{{ edge_public_net6 | regex_replace('::/60$', '::1') }}"
edge_bgp_password: "{{ lookup('ansible.builtin.env', 'EDGE_BGP_PASSWORD') }}"   # optional MD5 password

# --- BIRD -----------------------------------------------------------------------
bird_config_path: /etc/bird.conf
bird_roa_dir: /etc/bird
roa_url_v4: https://dn42.burble.com/roa/dn42_roa_bird2_4.conf
roa_url_v6: https://dn42.burble.com/roa/dn42_roa_bird2_6.conf
roa_min_entries: 50         # refuse to load a ROA file smaller than this (broken download)
bfd_interval_ms: 500
bfd_multiplier: 6           # ~3 s to detect a dead mesh link

# --- Host hardening -------------------------------------------------------------
ssh_harden: true
ssh_allow_from: []          # e.g. ["198.51.100.0/24", "2001:db8::/32"]; empty = anywhere, rate-limited
dn42_input_tcp_ports: []    # services on the router itself reachable from dn42 (e.g. [53])
dn42_input_udp_ports: []
auto_security_updates: true
