# R5 — Linode (Akamai) Sydney (region id: ap-southeast)
router_id: 5
location: Sydney, AU
provider: Linode
provider_region: ap-southeast
public_interface: eth0         # TODO: check with `ip -br link`
public_ipv4: 203.0.113.5       # TODO
public_ipv6: ""

community_region: 53           # Pacific & Oceania
community_country: 1036        # Australia

ebgp_peers: []

# Road warrior is IPv6-only here until this PoP gets an IPv4 pool, e.g.
# rw_pool4: 172.22.169.xx/29

# Provider VPC behind this router: created and attached when the server is first created
# (see docs/HOSTING.md, "Provider VPC behind a router")
vpc_enabled: true
vpc_type: vlan             # Linode VLAN: plain Layer 2, IPv6 works, nothing filtered
# dn42 IPv4 subnet behind this router (a /29 allocated in your IPAM, inside dn42_aggregates4).
# The router takes the first address; hosts behind it use the rest. Empty = IPv6 only.
vpc_dn42_net4: ""
