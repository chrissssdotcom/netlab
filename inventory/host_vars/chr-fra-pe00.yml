# chr-fra-pe00.dc.chrissss.dn42 — Linode Frankfurt 2 (region id: de-fra-2)
router_id: 2
location: Frankfurt, DE
provider: Linode
provider_region: de-fra-2
public_interface: eth0         # Linode public NIC; the VLAN arrives as eth1
public_ipv4: 203.0.113.2       # TODO
public_ipv6: ""                # optional

community_region: 41           # Europe
community_country: 1276        # Germany

# External dn42 neighbours at this PoP. One entry per peer; the tunnel is
# dn42-<name>, the BGP session ebgp_<name>. Example (uncomment and fill in):
ebgp_peers: []
#  - name: example              # a-z0-9, max 10 chars
#    asn: 4242421234
#    wg_pubkey: "base64-public-key-from-the-peer="
#    wg_endpoint: "peer.example.net:23420"   # host:port they listen on; omit if they dial you
#    peer_ll: "fe80::1234"      # their link-local on the tunnel
#    listen_port: 21234         # default: 20000 + last four digits of their ASN
#    latency: 2                 # 64511:1-9   measured RTT bracket
#    bandwidth: 24              # 64511:21-25 (24 = >=100 Mbit)
#    crypto: 34                 # 64511:34   WireGuard
#    bfd: false                 # only if the peer runs BFD too


# Provider VPC behind this router: created and attached when the server is first created
# (see docs/HOSTING.md, "Provider VPC behind a router")
vpc_enabled: true
vpc_type: vlan             # Linode VLAN: plain Layer 2, IPv6 works, nothing filtered

# IPv4: this PoP's /29 (one per PoP, from dn42_aggregates4). Layout: +1 router/gateway,
# +2 loopback, +3 road-warrior /32, +4..+6 hosts behind the router. The same /29 is the
# provider VPC/VLAN subnet when vpc_enabled is true. Allocated in IPAM.
pop_block4: 172.22.169.40/29
