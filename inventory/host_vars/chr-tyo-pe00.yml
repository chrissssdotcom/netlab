# chr-tyo-pe00.dc.chrissss.dn42 — Linode Tokyo 3 (region id: jp-tyo-3)
router_id: 4
location: Tokyo, JP
provider: Linode
provider_region: jp-tyo-3
public_interface: eth0         # Linode public NIC; the VLAN arrives as eth1
public_ipv4: 203.0.113.4       # TODO
public_ipv6: ""

community_region: 52           # Asia-E
community_country: 1392        # Japan

ebgp_peers: []


# Provider VPC behind this router: created and attached when the server is first created
# (see docs/HOSTING.md, "Provider VPC behind a router")
vpc_enabled: true
vpc_type: vlan             # Linode VLAN: plain Layer 2, IPv6 works, nothing filtered

# IPv4: this PoP's /29 (one per PoP, from dn42_aggregates4). Layout: +1 router/gateway,
# +2 loopback, +3 road-warrior /32, +4..+6 hosts behind the router. The same /29 is the
# provider VPC/VLAN subnet when vpc_enabled is true. Allocated in IPAM.
pop_block4: 172.22.169.56/29
