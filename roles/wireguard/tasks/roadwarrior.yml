- name: Road warrior — enabled
  when: rw_enabled | bool
  block:
    - name: Preflight — interface name cannot collide with mesh/peer globs, port with tunnels
      ansible.builtin.assert:
        that:
          - rw_interface is match('^[a-z][a-z0-9]{0,14}$')
          - not (rw_interface is match('^(wg-r|dn42)'))
          - ((rw_listen_port | int) - (mesh_port_base | int)) not in
              (mesh_peers | map('extract', hostvars, 'router_id') | map('int') | list)
          - (rw_listen_port | int) not in (ebgp_peers | map(attribute='listen_port', default=0) | map('int') | list)
        fail_msg: "rw_interface must not start with wg-r or dn42, and rw_listen_port must not clash with a mesh or peering port"
        quiet: true

    - name: Preflight — IPv4 pool is a valid aligned prefix
      ansible.builtin.assert:
        that:
          - rw_pool4 is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/(2[4-9]|30)$')
          - (rw_pool4_off | int) % (rw_pool4_size | int) == 0
        fail_msg: "rw_pool4 must be an aligned /24../30 taken from your dn42_aggregates4 (e.g. 172.22.169.48/29)"
        quiet: true
      when: rw_pool4 | length > 0

    - name: Preflight — clients
      ansible.builtin.assert:
        that:
          - rw_client.name is match('^[a-z0-9-]{1,20}$')
          - rw_client.wg_pubkey is match('^[A-Za-z0-9+/]{43}=$')
          - (rw_client.id | int) >= 2 and (rw_client.id | int) <= 254
          - (rw_pool4 | length == 0) or (rw_client.id | int) <= ((rw_pool4_size | int) - 2)
          - rw_clients | map(attribute='id') | map('int') | unique | length == rw_clients | length
          - rw_clients | map(attribute='name') | unique | length == rw_clients | length
          - rw_clients | map(attribute='wg_pubkey') | unique | length == rw_clients | length
        fail_msg: >-
          rw_clients[{{ rw_client.name | default('?') }}]: name a-z0-9- (max 20), 44-char wg_pubkey,
          unique name/id/key, id 2..254 (and <= pool size - 2 where the PoP has a v4 pool)
        quiet: true
      loop: "{{ rw_clients }}"
      loop_control:
        loop_var: rw_client
        label: "{{ rw_client.name | default('?') }}"

    - name: Road warrior tunnel config
      ansible.builtin.template:
        src: wg-rw.conf.j2
        dest: "/etc/wireguard/{{ rw_interface }}.conf"
        mode: "0600"
      register: wg_rw_cfg

    - name: Road warrior tunnel enabled and up
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ rw_interface }}"
        enabled: true
        state: started

    - name: Apply changed clients in place (connected devices keep their session)
      ansible.builtin.shell: >-
        wg syncconf {{ rw_interface }} <(wg-quick strip {{ rw_interface }}) &&
        wg set {{ rw_interface }} private-key /etc/wireguard/node.key
      args:
        executable: /bin/bash
      changed_when: true
      when: wg_rw_cfg is changed

- name: Road warrior — disabled, make sure nothing is left behind
  when: not (rw_enabled | bool)
  block:
    - name: Stop the road warrior tunnel
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ rw_interface }}"
        state: stopped
        enabled: false
    - name: Delete the road warrior config
      ansible.builtin.file:
        path: "/etc/wireguard/{{ rw_interface }}.conf"
        state: absent
