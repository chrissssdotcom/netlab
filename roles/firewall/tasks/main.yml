- name: Gather service facts
  ansible.builtin.service_facts:

- name: Install the nftables ruleset (syntax-checked before it is installed)
  ansible.builtin.template:
    src: dn42.nft.j2
    dest: /etc/nftables/dn42.nft
    mode: "0600"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Point nftables.service at the ruleset
  ansible.builtin.copy:
    dest: /etc/sysconfig/nftables.conf
    mode: "0600"
    content: |
      # {{ ansible_managed }}
      include "/etc/nftables/dn42.nft"
  notify: Reload nftables

- name: Disable firewalld — nftables owns the box
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped
    enabled: false
    masked: true
  when: "'firewalld.service' in ansible_facts.services"

- name: Enable and start nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
