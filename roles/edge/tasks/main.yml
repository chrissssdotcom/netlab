# Public addresses and the BGP session to the edge router (see docs/EDGE-UNIFI.md).
# BIRD's side of the session is in the bird role; this role binds the public /32 and
# refuses values that would announce something wrong.
- name: Edge BGP
  when: edge_bgp_enabled | bool
  block:
    - name: Preflight — addresses and prefixes
      ansible.builtin.assert:
        that:
          - edge_local4 is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
          - edge_neighbor4 is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
          - edge_local4 != edge_neighbor4
          - edge_public_ipv4 is match('^(?!10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.)[0-9]{1,3}(\.[0-9]{1,3}){3}$')
          - (edge_local_asn | int) != (edge_peer_asn | int)
          - (edge_local_asn | int) >= 64512 and (edge_peer_asn | int) >= 64512
          - (edge_neighbor6 | length == 0) == (edge_local6 | length == 0)
          - (edge_neighbor6 | length == 0) or (edge_public_net6 | length > 0)
        fail_msg: >-
          edge_local4/edge_neighbor4 must be distinct IPv4 addresses on the shared LAN, edge_public_ipv4 a public
          (not private or dn42) IPv4 address, both ASNs private and different, and IPv6 needs both ends plus
          edge_public_net6. Values: {{ edge_local4 }} / {{ edge_neighbor4 }} / {{ edge_public_ipv4 }}.
        quiet: true

    - name: Preflight — the IPv6 slice is an aligned /60 inside the site /48
      ansible.builtin.assert:
        that:
          - edge_site_net6 is match('^[0-9a-f:]+::/48$')
          - edge_public_net6 is match('^[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}::/60$')
          - edge_public_net6.startswith(edge_site_net6.split('::')[0] ~ ':')
          - ((edge_public_net6.split(':')[3] | int(0, 16)) % 16) == 0
        fail_msg: >-
          edge_public_net6 ({{ edge_public_net6 }}) must be an aligned /60 (fourth group a multiple of 0x10)
          inside edge_site_net6 ({{ edge_site_net6 }}).
        quiet: true
      when: edge_neighbor6 | length > 0

    - name: Public dummy interface unit
      ansible.builtin.template:
        src: edge-public.service.j2
        dest: /etc/systemd/system/edge-public.service
        mode: "0644"
      notify: Restart edge-public

    - name: Public dummy interface enabled and up
      ansible.builtin.systemd_service:
        name: edge-public.service
        enabled: true
        state: started
        daemon_reload: true

- name: Edge BGP disabled — remove the public interface unit if an earlier run created it
  when: not (edge_bgp_enabled | bool)
  block:
    - name: Stop and disable edge-public
      ansible.builtin.systemd_service:
        name: edge-public.service
        state: stopped
        enabled: false
      failed_when: false
    - name: Delete the unit
      ansible.builtin.file:
        path: /etc/systemd/system/edge-public.service
        state: absent
