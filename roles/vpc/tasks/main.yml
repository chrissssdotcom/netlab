# The provider VPC arrives as a second NIC. Bring it up (DHCP for the provider's
# private address, never a default route) and give it the router's dn42 address(es)
# so hosts behind it can use this router as their gateway.
- name: VPC enabled
  when: vpc_enabled | bool
  block:
    - name: Work out which NIC is the VPC
      when: vlan_id | string | length == 0
      ansible.builtin.set_fact:
        vpc_candidates: >-
          {{ ansible_facts['interfaces']
             | reject('match', '^(lo|wg-|dn42|rw|virbr|docker|veth|br-)')
             | reject('equalto', public_interface) | list }}

    - name: Exactly one candidate, or vpc_interface says which
      when: vlan_id | string | length == 0
      ansible.builtin.assert:
        that: (vpc_interface | length > 0) or (vpc_candidates | length == 1)
        fail_msg: >-
          Found {{ vpc_candidates | length }} candidate NICs ({{ vpc_candidates | join(', ') }}).
          A VPC is attached when the server is created, so an existing server needs it attached
          in the provider console first. Set vpc_interface in host_vars if there is more than one.
        quiet: true

    - name: Use that NIC
      when: vlan_id | string | length == 0
      ansible.builtin.set_fact:
        vpc_iface: "{{ vpc_interface if vpc_interface | length > 0 else vpc_candidates | first }}"

    - name: Work out where vpc_dn42_net4 sits (integer arithmetic, no extra collections)
      ansible.builtin.set_fact:
        vpc_net4_in_ours: >-
          {% set ns = namespace(ok=false) %}
          {% for agg in dn42_aggregates4 %}
          {% set a = agg.split('/')[0].split('.') | map('int') | list %}
          {% set b = vpc_dn42_net4.split('/')[0].split('.') | map('int') | list %}
          {% set ai = ((a[0] * 256 + a[1]) * 256 + a[2]) * 256 + a[3] %}
          {% set bi = ((b[0] * 256 + b[1]) * 256 + b[2]) * 256 + b[3] %}
          {% set asz = 2 ** (32 - (agg.split('/')[1] | int)) %}
          {% set bsz = 2 ** (32 - (vpc_dn42_net4.split('/')[1] | int)) %}
          {% if bi >= ai and bi + bsz <= ai + asz %}{% set ns.ok = true %}{% endif %}
          {% endfor %}
          {{ ns.ok }}
        vpc_net4_aligned: >-
          {% set b = vpc_dn42_net4.split('/')[0].split('.') | map('int') | list %}
          {{ (b[3] % (2 ** (32 - (vpc_dn42_net4.split('/')[1] | int)))) == 0 }}
      when: vpc_dn42_net4 | length > 0

    - name: Preflight — the dn42 subnets are ours
      ansible.builtin.assert:
        that:
          - vpc_type in ['vpc', 'vlan']
          - vpc_dn42_net6 is match(dn42_prefix6)
          - (vpc_dn42_net4 | length == 0) or (vpc_dn42_net4 is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/(2[4-9]|30)$'))
          - (vpc_dn42_net4 | length == 0) or (vpc_net4_in_ours | trim | bool)
          - (vpc_dn42_net4 | length == 0) or (vpc_net4_aligned | trim | bool)
        fail_msg: >-
          vpc_dn42_net4 ({{ vpc_dn42_net4 }}) must be an aligned /24-/30 inside dn42_aggregates4
          ({{ dn42_aggregates4 | join(', ') }}). The default is this PoP's own /29 (pop_block4).
          Anything outside the announced space would be filtered by BGP and by the forwarding rules.
        quiet: true

    - name: NetworkManager profile for the VPC NIC
      ansible.builtin.template:
        src: dn42-vpc.nmconnection.j2
        dest: /etc/NetworkManager/system-connections/dn42-vpc.nmconnection
        mode: "0600"
      notify: Activate VPC connection

- name: VPC disabled — remove our profile if an earlier run created it
  ansible.builtin.file:
    path: /etc/NetworkManager/system-connections/dn42-vpc.nmconnection
    state: absent
  when: not (vpc_enabled | bool)
  notify: Reload NetworkManager connections
