- name: Apply sysctls
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded

- name: Restart dn42 loopback
  ansible.builtin.systemd_service:
    name: dn42-loopback.service
    state: restarted
    daemon_reload: true

- name: Reload sshd
  ansible.builtin.shell: sshd -t && systemctl reload sshd
  changed_when: true
