# Test-only: give every PoP one external peer so the eBGP path is rendered and parsed.
ebgp_peers:
  - name: testpeer
    asn: 4242421080
    wg_pubkey: "dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q="
    wg_endpoint: "peer.example.net:23420"
    peer_ll: "fe80::1080"
    latency: 3
    bandwidth: 24
    crypto: 34
    bfd: true

# Road warrior clients: one everywhere, one pinned to a single PoP, one with the
# highest id that fits a /29 pool (6) — the keys are throwaway.
rw_dns: ["fd42:d42:d42:54::1"]
rw_clients:
  - { name: laptop,  id: 2, wg_pubkey: "ZmFrZWZha2VmYWtlZmFrZWZha2VmYWtlZmFrZWZha2U=" }
  - { name: phone,   id: 6, wg_pubkey: "ZmFrZTJmYWtlMmZha2UyZmFrZTJmYWtlMmZha2UyZmE=", pops: [r2, r4] }
  - { name: tablet,  id: 3, wg_pubkey: "ZmFrZTNmYWtlM2Zha2UzZmFrZTNmYWtlM2Zha2UzZmE=", pops: [r3] }

# VPC behind each router (render-only: the NIC name and subnet are made up)
vpc_enabled: true
vpc_interface: ens7
vpc_dn42_net4: 172.22.169.60/30
