# Test-only: give every PoP one external peer so the eBGP path is rendered and parsed.
ebgp_peers:
  - name: testpeer
    asn: 4242421080
    wg_pubkey: "dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q="
    wg_endpoint: "peer.example.net:23420"
    peer_ll: "fe80::1080"
    latency: 3
    bandwidth: 24
    crypto: 34
    bfd: true

# Road warrior clients: one everywhere (and the single IPv4 /32 at each PoP), one pinned to
# two PoPs, one pinned to chr-lax-pe00 — the keys are throwaway.
rw_dns: ["fd42:d42:d42:54::1"]
rw_clients:
  - { name: laptop,  id: 2, ipv4: true, wg_pubkey: "ZmFrZWZha2VmYWtlZmFrZWZha2VmYWtlZmFrZWZha2U=" }
  - { name: phone,   id: 6, wg_pubkey: "ZmFrZTJmYWtlMmZha2UyZmFrZTJmYWtlMmZha2UyZmE=", pops: [chr-fra-pe00, chr-tyo-pe00] }
  - { name: tablet,  id: 3, wg_pubkey: "ZmFrZTNmYWtlM2Zha2UzZmFrZTNmYWtlM2Zha2UzZmE=", pops: [chr-lax-pe00] }

# VPC/VLAN behind each router (render-only: the NIC name is made up). The IPv4 subnet is
# each PoP's own /29 (pop_block4), the default.
vpc_enabled: true
vpc_interface: ens7
