# Build or update every dn42 PoP:   ansible-playbook site.yml
# One PoP after the first full run: ansible-playbook site.yml --limit r3
- name: Build dn42 routers (AS4242423420)
  hosts: dn42_routers
  become: true
  roles:
    - common      # preflight checks, packages, sysctl, loopback, SSH, updates
    - firewall    # nftables: default-deny in, dn42-only forwarding
    - wireguard   # node key, full mesh + external peering tunnels
    - bird        # OSPFv3 + BFD, iBGP mesh, eBGP, ROA
