# Road warrior client configs, one per device per PoP, with a placeholder where the
# device's own private key goes. Nothing secret is produced, so the output is safe in
# a Semaphore task log; run locally it is also written to build/clients/.
#   ansible-playbook rw-clients.yml                 # everything
#   ansible-playbook rw-clients.yml --limit r2      # one PoP
#   ansible-playbook rw-clients.yml -e only=laptop  # one device
- name: Road warrior client configs
  hosts: dn42_routers
  gather_facts: false
  become: true
  vars:
    only: ""
    out_dir: "{{ playbook_dir }}/build/clients"
    clients_to_render: "{{ rw_clients_here | selectattr('name', 'match', (only ~ '$') if only else '.*') | list }}"
  tasks:
    - name: Nothing to do on this PoP
      ansible.builtin.meta: end_host
      when: not (rw_enabled | bool) or clients_to_render | length == 0

    - name: PoP can be dialled
      ansible.builtin.assert:
        that: rw_endpoint | length > 0
        fail_msg: "{{ inventory_hostname }} has no public_ipv4 or wg_endpoint — set one (a DDNS name for the home PoP)"
        quiet: true

    - name: Read this PoP's public key
      ansible.builtin.shell: wg pubkey < /etc/wireguard/node.key
      register: rw_server_pub
      changed_when: false

    - name: Output directory
      ansible.builtin.file:
        path: "{{ out_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Render client configs
      ansible.builtin.template:
        src: roles/wireguard/templates/rw-client.conf.j2
        dest: "{{ out_dir }}/{{ rw_client.name }}-{{ inventory_hostname }}.conf"
        mode: "0644"
      vars:
        rw_server_pubkey: "{{ rw_server_pub.stdout }}"
      loop: "{{ clients_to_render }}"
      loop_control:
        loop_var: rw_client
        label: "{{ rw_client.name }}-{{ inventory_hostname }}.conf"
      delegate_to: localhost
      become: false

    - name: Show them (paste or turn into a QR code on the device side)
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', out_dir ~ '/' ~ rw_client.name ~ '-' ~ inventory_hostname ~ '.conf').splitlines() }}"
      loop: "{{ clients_to_render }}"
      loop_control:
        loop_var: rw_client
        label: "{{ rw_client.name }}-{{ inventory_hostname }}"
